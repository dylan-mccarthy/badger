name: BadgeCluster checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'badge/apps/badgecluster/**'
      - 'tests/test_badgecluster*.py'
      - 'tools/*badgecluster*'
      - '.github/workflows/badgecluster.yml'
  pull_request:
    paths:
      - 'badge/apps/badgecluster/**'
      - 'tests/test_badgecluster*.py'
      - 'tools/*badgecluster*'
      - '.github/workflows/badgecluster.yml'
permissions:
  contents: read
jobs:
  badgecluster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-badgecluster.txt
      - run: python -m unittest discover -s tests -p 'test_badgecluster*.py'
      - run: python tools/preview_badgecluster.py
      - run: python .github/skills/hyb26-skill/scripts/validate_app.py badge/apps/badgecluster
      - run: python .github/scripts/validate_app_readmes.py badge/apps
      - uses: actions/upload-artifact@v4
        with:
          name: badgecluster-host-previews
          path: badge/apps/badgecluster/assets/preview_*.png
